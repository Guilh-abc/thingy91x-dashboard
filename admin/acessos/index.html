<!doctype html>
<html lang="pt-BR" data-pagina-real>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Acessos | Administração</title>
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../relatorio-demo/relatorio.css?v=2">
<link rel="stylesheet" href="../../design-tokens.css?v=2">
</head>
<body>
<header class="topo">
  <div><h1>Acessos</h1><small>Usuários e papéis (viewer ou admin). As ações valem só depois que o servidor confirmar.</small></div>
  <nav><a href="../../">Início</a><a href="../../ntn/">Rastreador</a><a href="../../utilities/">Utilities</a><a href="../../consumo/">Consumo</a><a href="../../relatorio-demo/">Relatório (demo)</a></nav>
</header>
<main>
  <section class="card" id="aviso"><h2>Situação</h2><p class="frase" id="situacao">Verificando a sessão no servidor...</p></section>
  <section class="card" id="painel" hidden>
    <h2>Usuários</h2><p class="frase">Crie, remova ou conceda admin.</p>
    <form id="novo" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <input id="email" type="email" required placeholder="email do usuário" style="flex:1;min-width:220px;padding:8px;border-radius:9px;border:1px solid var(--borda)">
      <select id="papel" style="padding:8px;border-radius:9px;border:1px solid var(--borda)"><option value="viewer">viewer</option><option value="admin">admin</option></select>
      <button class="btn btn-primary" type="submit">Criar usuário</button>
    </form>
    <table style="width:100%;border-collapse:collapse"><thead><tr><th align="left">Email</th><th align="left">Papel</th><th></th></tr></thead><tbody id="lista"></tbody></table>
  </section>
</main>
<script src="../../icons.js?v=1"></script>
<script src="../../roles.js?v=1"></script>
<script src="acessos.js?v=1"></script>
</body>
</html>
