[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Scheduled alerts need Netlify Pro (or schedules enabled). Leave DISABLED by default
# so free-tier / linked Git deploys always succeed. Enable manually in Netlify UI or
# uncomment below when the plan supports it:
# [functions."alerts-schedule"]
#   schedule = "*/15 * * * *"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# v32 segurança: `netlify deploy --dir .` publica tudo da pasta. Estes arquivos são locais/sensíveis
# (serial-telemetry.json tem IP, APs Wi‑Fi e coordenadas do Mac) — forçamos 404 mesmo que o arquivo exista.
[[redirects]]
  from = "/serial-telemetry.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/serial_telemetry.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/proxy.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Thingy91X-Dashboard.command"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/thingy.sh"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/api/alerts"
  to = "/.netlify/functions/alerts"
  status = 200

[[redirects]]
  from = "/api/alerts/*"
  to = "/.netlify/functions/alerts/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/nrfcloud/:splat"
  status = 200
