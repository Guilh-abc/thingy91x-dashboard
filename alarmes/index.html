<!doctype html>
<html lang="pt-BR" data-pagina-real data-tema="escuro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alarmes · IoT Cat-M + NTN</title>
<link rel="stylesheet" href="../design-tokens.css?v=2"><link rel="stylesheet" href="../shell.css?v=7">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
body{margin:0;background:#0f172a;color:#e5e7eb;font-family:system-ui,Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}.sub{color:#9ca3af;margin:0 0 14px}
.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:14px;margin-bottom:12px}
.aviso{border-color:#1d4ed8;color:#bfdbfe}.aviso.erro{border-color:#b91c1c;color:#fecaca}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:#1d4ed8;border-color:#1d4ed8}
.btn{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:#1d4ed8;border-color:#1d4ed8}.btn.ok{background:#15803d;border-color:#15803d}.btn.rem{background:#7f1d1d;border-color:#b91c1c}
.ico{width:16px;height:16px;stroke:currentColor;fill:none}
.reg{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.reg b{display:block}.meta{color:#9ca3af;font-size:13px}
.st{font-size:12px;border-radius:999px;padding:2px 8px;margin-left:6px}
.st.ok{background:#14532d;color:#bbf7d0}.st.disparado{background:#7f1d1d;color:#fecaca}.st.n{background:#374151;color:#d1d5db}.st.info{background:#1e3a8a;color:#bfdbfe}
form label{display:block;margin:8px 0 4px;color:#9ca3af;font-size:13px}
form input,form select{width:100%;box-sizing:border-box;background:#0f172a;color:#e5e7eb;border:1px solid #374151;border-radius:8px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
#mapa{height:320px;border-radius:10px;margin-top:8px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style></head><body>
<main>
<h1>Alarmes</h1><p class="sub">Gatilhos de todos os sistemas, com aviso por e-mail para guilhermeromionetto@gmail.com</p>
<div id="avisos"></div>
<div class="filtros" id="filtros"></div>
<div class="acoes" id="topo" hidden><button class="btn pri" id="novo"><svg class="ico"><use href="#i-convidar"></use></svg>Novo alarme</button><button class="btn" id="teste"><svg class="ico"><use href="#i-email"></use></svg>Enviar e-mail de teste</button><button class="btn" id="avaliar"><svg class="ico"><use href="#i-atualizar"></use></svg>Avaliar agora</button></div>
<div id="form" class="card" hidden></div>
<div id="lista" style="margin-top:12px"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="alarmes.js?v=1"></script><script src="../icons.js?v=5"></script>
<script src="../shell.js?v=8" data-pagina="alarmes"></script>
</body></html>
