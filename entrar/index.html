<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrando | IoT Cat-M + NTN</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../design-tokens.css?v=2">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 Inter,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#0b1530,#10204a);color:#fff}
.caixa{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:32px;max-width:420px;width:calc(100% - 32px);text-align:center}
.giro{width:36px;height:36px;border:4px solid rgba(255,255,255,.2);border-top-color:#2f7cf6;border-radius:50%;margin:0 auto 14px;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.giro{animation:none}}
p{color:#c9d6f2}a{color:#cfe0ff}
</style>
</head>
<body>
<main class="caixa" aria-live="polite">
  <div class="giro" aria-hidden="true"></div>
  <h1 id="titulo" style="font-size:1.3rem;margin:0 0 6px">Verificando seu acesso</h1>
  <p id="msg">Só um instante, estamos abrindo o painel certo para você.</p>
</main>
<script src="entrar.js?v=3"></script>
</body>
</html>
